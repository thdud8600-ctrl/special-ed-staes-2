<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>특수교육통계 비교</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#d9dde3; --line2:#eceff3; --ink:#1f2933; --muted:#66727f;
  --accent:#2563eb; --diff:#ccf2a4; --diff-line:#7cc242; --active:#f59e0b; --head:#f0f2f5;
  --bad:#d64545; --ok:#2f9e44; --warn:#e8590c;
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:13px}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:700}
header .meta{color:var(--muted)}
header .chips{display:flex;gap:8px;margin-left:auto;align-items:center}
.chip{padding:3px 10px;border-radius:999px;background:var(--head);font-weight:600}
.chip.bad{background:#fde8e8;color:var(--bad)} .chip.ok{background:#e6f6ea;color:var(--ok)}
.body{display:grid;grid-template-columns:230px 1fr;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside input{margin:10px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit}
.slist{overflow:auto;flex:1}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 12px;border-left:3px solid transparent;cursor:pointer}
.sitem:hover{background:var(--bg)}
.sitem.on{background:#eef3fe;border-left-color:var(--accent);font-weight:700}
.badge{min-width:22px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;text-align:center;background:#e6f6ea;color:var(--ok)}
.badge.bad{background:#fde8e8;color:var(--bad)} .badge.err{background:#fff0e6;color:var(--warn)}
main{display:grid;grid-template-rows:auto auto 1fr 6px var(--bottom,32%);min-width:0;min-height:0}
.shead{display:flex;gap:12px;align-items:baseline;padding:10px 14px 6px;flex-wrap:wrap}
.shead h2{margin:0;font-size:15px}
.shead .files{color:var(--muted)}
.tabs{display:flex;gap:4px;padding:0 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;white-space:nowrap;padding:6px 10px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:var(--head);color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--panel);color:var(--ink);font-weight:700;position:relative;top:1px}
.tab .n{display:inline-block;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;min-height:0}
.pane{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0;min-height:0}
.pane h3{margin:0;padding:6px 10px;font-size:13px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.pane h3 small{color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{overflow:auto;flex:1;position:relative}
table.sheet{border-collapse:separate;border-spacing:0;font-size:12px}
.sheet td,.sheet th{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:3px 6px;white-space:pre-wrap;vertical-align:middle;min-width:44px}
.sheet th{background:var(--head);color:var(--muted);font-weight:500;position:sticky;z-index:2}
.sheet thead th{top:0;text-align:center}
.sheet tbody th{left:0;text-align:right;z-index:1}
.sheet thead th.corner{left:0;z-index:3}
.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.txt{text-align:center}
.sheet td.diff{background:var(--diff);box-shadow:inset 0 0 0 1px var(--diff-line);font-weight:700;cursor:pointer}
.sheet td.active{box-shadow:inset 0 0 0 2px var(--active);animation:flash 1.2s ease 2}
@keyframes flash{50%{background:#fff3c4}}
.missing{padding:30px;color:var(--muted);text-align:center}
.resizer{cursor:row-resize;background:var(--line);}
.issues{display:flex;flex-direction:column;background:var(--panel);min-height:0}
.ibar{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ibar h3{margin:0;font-size:14px}
.ibar .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ibar .seg button{border:none;background:var(--panel);padding:4px 10px}
.ibar .seg button.on{background:var(--accent);color:#fff}
.ibar .hint{color:var(--muted);margin-left:auto}
.ilist{overflow:auto;flex:1}
table.it{width:100%;border-collapse:collapse}
.it th{position:sticky;top:0;background:var(--head);text-align:left;padding:5px 8px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
.it td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.it tr.row{cursor:pointer}
.it tr.row:hover td{background:#f3f7ff}
.it tr.on td{background:#fff6dd}
.it td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.it td.d{font-weight:700;color:var(--bad);text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--head);font-size:11px;white-space:nowrap}
.empty{padding:22px;color:var(--muted);text-align:center}
.start{max-width:980px;margin:4vh auto;padding:0 16px}
.start .lead{font-size:15px;text-align:center;margin:0 0 18px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{padding:22px;border:2px dashed var(--line);border-radius:12px;background:var(--panel);text-align:center;line-height:1.7;min-height:260px}
.drop h2{font-size:17px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px}
.center{text-align:center}
.flist{list-style:none;margin:12px 0 0;padding:0;text-align:left;max-height:240px;overflow:auto}
.flist li{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-bottom:1px solid var(--line2);font-size:12px}
.flist li.cnt{justify-content:flex-end;color:var(--muted);border:none}
.flist .x{border:none;background:none;color:var(--muted);font-size:15px;line-height:1}
.go{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0 10px}
.btn.big{padding:11px 34px;font-size:15px;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.drop.over{border-color:var(--accent);background:#eef3fe}
.drop code{background:var(--head);padding:1px 5px;border-radius:4px}
.btn{padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px}
.btn.ghost{background:var(--panel);color:var(--accent)}
.legend{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:12px;background:var(--diff);border:1px solid var(--diff-line)}
@media (max-width:900px){
  .body{grid-template-columns:1fr}
  aside{max-height:160px}
  .split{grid-template-columns:1fr}
  .split .pane{min-height:240px}
  .boxes{grid-template-columns:1fr}
  header .chips{margin-left:0;flex-wrap:wrap}
  main{grid-template-rows:auto auto auto 6px 50vh;overflow:auto}
  .app{height:auto;min-height:100vh}
}
@media print{.resizer,aside,header .chips{display:none}}
</style>

<body>
<div class="app" id="app"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
// 파이썬(compare.py)이 비교 결과를 아래 자리에 넣는다. 비어 있으면 결과 파일(.json)을 불러오는 화면이 나온다.
const EMBEDDED = /*__DATA__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const colName = n => { let s = ""; while (n) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };

const state = { data: null, school: 0, sheet: 0, scope: "school", type: "all", active: null, query: "" };

function loadData(data) {
  state.data = data;
  // 확인필요가 많은 학교부터가 아니라, 받은 순서대로 둔다. 첫 화면은 확인필요가 있는 첫 학교.
  const first = data.schools.findIndex(s => s.diffCount > 0 || s.error);
  state.school = first < 0 ? 0 : first;
  state.sheet = firstDiffSheet(state.school);
  state.active = null;
  renderApp();
}
function firstDiffSheet(si) {
  const s = state.data.schools[si];
  const i = (s.sheets || []).findIndex(sh => sh.diffs.length);
  return i < 0 ? 0 : i;
}

// ---------------------------------------------------------------- 브라우저 비교 엔진
// compare.py 와 같은 규칙을 그대로 옮겼다. 엑셀(xlsx)을 브라우저 안에서 직접 풀어 읽고,
// 숫자는 엑셀에 저장된 글자를 정수(BigInt)+자릿수로 바꿔 비교하므로 소수점 오차가 없다.
// 외부 라이브러리·인터넷 없이 동작하며 파일은 어디에도 전송되지 않는다.
const XL = (() => {
  const MAIN = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const RELNS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const PKG = "http://schemas.openxmlformats.org/package/2006/relationships";

  // ---- zip 풀기 (DecompressionStream 사용)
  async function unzip(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--)
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error("엑셀(xlsx) 파일이 아닙니다");
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const td = new TextDecoder("utf-8"), entries = {};
    for (let k = 0; k < count; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      entries[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { method, size, off };
      p += 46 + nl + el + cl;
    }
    return {
      has: n => n in entries,
      async text(n) {
        const e = entries[n];
        const start = e.off + 30 + dv.getUint16(e.off + 26, true) + dv.getUint16(e.off + 28, true);
        const raw = u8.subarray(start, start + e.size);
        if (e.method === 0) return td.decode(raw);
        const ds = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return td.decode(await new Response(ds).arrayBuffer());
      },
    };
  }
  const xml = s => new DOMParser().parseFromString(s, "application/xml");
  const kids = (el, name, ns = MAIN) => Array.from(el.children).filter(c => c.localName === name && c.namespaceURI === ns);
  const kid = (el, name) => kids(el, name)[0] || null;
  function textOf(el) {  // <si>/<is> 글자. 윗주(rPh)는 제외
    let s = "";
    for (const t of el.getElementsByTagNameNS(MAIN, "t")) {
      let up = t.parentElement, inRph = false;
      while (up && up !== el) { if (up.localName === "rPh") { inRph = true; break; } up = up.parentElement; }
      if (!inRph) s += t.textContent;
    }
    return s;
  }
  function normPath(p) {
    const out = [];
    for (const seg of p.split("/")) { if (seg === "..") out.pop(); else if (seg && seg !== ".") out.push(seg); }
    return out.join("/");
  }
  const colToNum = l => [...l].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);
  function parseRef(ref) { const m = /^\$?([A-Z]+)\$?(\d+)$/.exec(ref.toUpperCase()); return [+m[2], colToNum(m[1])]; }

  async function readXlsx(buf) {
    const z = await unzip(buf);
    const rels = {};
    if (z.has("xl/_rels/workbook.xml.rels"))
      for (const r of xml(await z.text("xl/_rels/workbook.xml.rels")).getElementsByTagNameNS(PKG, "Relationship")) {
        const t = r.getAttribute("Target");
        rels[r.getAttribute("Id")] = t.startsWith("/") ? t.slice(1) : normPath("xl/" + t);
      }
    const shared = [];
    if (z.has("xl/sharedStrings.xml"))
      for (const si of kids(xml(await z.text("xl/sharedStrings.xml")).documentElement, "si")) shared.push(textOf(si));
    const sheets = [];
    const wb = xml(await z.text("xl/workbook.xml"));
    for (const sh of wb.getElementsByTagNameNS(MAIN, "sheet")) {
      const target = rels[sh.getAttributeNS(RELNS, "id")];
      if (!target || !z.has(target)) continue;
      sheets.push(readSheet(sh.getAttribute("name"), xml(await z.text(target)).documentElement, shared));
    }
    return sheets;
  }
  function readSheet(name, root, shared) {
    const cells = new Map(); let maxR = 0, maxC = 0;
    const sd = kid(root, "sheetData");
    for (const row of sd ? kids(sd, "row") : []) for (const c of kids(row, "c")) {
      const ref = c.getAttribute("r"); if (!ref) continue;
      const [r, col] = parseRef(ref);
      const t = c.getAttribute("t") || "n", v = kid(c, "v"), f = kid(c, "f");
      let val = null;
      if (t === "s") { if (v && v.textContent !== "") val = ["s", shared[parseInt(v.textContent, 10)]]; }
      else if (t === "inlineStr") { const is = kid(c, "is"); if (is) val = ["s", textOf(is)]; }
      else if (t === "str") { if (v) val = ["s", v.textContent]; }
      else if (t === "b") { if (v) val = ["b", v.textContent === "1" ? "TRUE" : "FALSE"]; }
      else if (t === "e") { if (v) val = ["e", v.textContent]; }
      else if (v && v.textContent.trim() !== "") val = ["n", v.textContent.trim()];
      if (!val && f) val = ["f", "=" + f.textContent];
      if (!val || (val[0] === "s" && val[1] === "")) continue;
      cells.set(r + "," + col, val);
      maxR = Math.max(maxR, r); maxC = Math.max(maxC, col);
    }
    const merges = [];
    const mcs = kid(root, "mergeCells");
    for (const mc of mcs ? kids(mcs, "mergeCell") : []) {
      const [a, b] = mc.getAttribute("ref").split(":");
      const [r1, c1] = parseRef(a), [r2, c2] = parseRef(b || a);
      merges.push([r1, c1, r2, c2]); maxR = Math.max(maxR, r2); maxC = Math.max(maxC, c2);
    }
    const widths = {};
    const cols = kid(root, "cols");
    for (const col of cols ? kids(cols, "col") : []) {
      const w = col.getAttribute("width");
      if (w) for (let i = +col.getAttribute("min"); i <= Math.min(+col.getAttribute("max"), 200); i++) widths[i] = parseFloat(w);
    }
    return { name, cells, merges, maxR, maxC, widths };
  }

  // ---- 정확한 소수: {n: BigInt, s: 소수 자릿수}
  function dec(str) {
    const m = /^([+-]?)(\d*)(?:\.(\d*))?(?:[eE]([+-]?\d+))?$/.exec(str);
    if (!m || (m[2] + (m[3] || "")) === "") return null;
    const frac = m[3] || "";
    let n = BigInt((m[2] + frac) || "0");
    if (m[1] === "-") n = -n;
    return { n, s: frac.length - parseInt(m[4] || "0", 10) };
  }
  const P10 = k => 10n ** BigInt(k);
  function align(a, b) { const s = Math.max(a.s, b.s); return [a.n * P10(s - a.s), b.n * P10(s - b.s), s]; }
  const decEq = (a, b) => { const [x, y] = align(a, b); return x === y; };
  const decSub = (b, a) => { const [x, y, s] = align(b, a); return { n: x - y, s }; };
  function decFmt(d) {
    let { n, s } = d;
    if (s <= 0) return (n * P10(-s)).toString();
    while (s > 0 && n % 10n === 0n) { n /= 10n; s--; }
    if (s === 0) return n.toString();
    const neg = n < 0n, digits = (neg ? -n : n).toString().padStart(s + 1, "0");
    return (neg ? "-" : "") + digits.slice(0, -s) + "." + digits.slice(-s);
  }
  const isInt = d => decFmt(d).indexOf(".") < 0;

  // ---- compare.py 와 같은 규칙
  const NUM_TEXT = /^[+-]?(\d{1,3}(,\d{3})+|\d+)(\.\d+)?$/;
  const normText = s => s.normalize("NFC").replace(/\s+/g, " ").trim();
  function classify(cell) {
    if (!cell) return ["empty", null];
    const [kind, raw] = cell;
    if (kind === "n") { const d = dec(raw); return d ? ["num", d] : ["text", raw]; }
    if (kind === "s") {
      const t = normText(raw);
      if (t === "") return ["empty", null];
      if (NUM_TEXT.test(t)) return ["num", dec(t.replace(/,/g, ""))];
      return ["text", t];
    }
    return [kind, raw];
  }
  function display(cell) {
    if (!cell) return "";
    if (cell[0] === "n") { const d = dec(cell[1]); return d ? decFmt(d) : cell[1]; }
    return cell[1];
  }
  const T = { NUM: "숫자 다름", BLANK: "한쪽만 값 있음", TEXT: "글자 다름", KIND: "형식 다름", SHEET: "시트 없음" };
  function compareCells(a, b) {
    const [ka, va] = classify(a), [kb, vb] = classify(b);
    if (ka === "empty" && kb === "empty") return null;
    if (ka === "num" && kb === "num") return decEq(va, vb) ? null : [T.NUM, decSub(vb, va)];
    if (ka === "empty" || kb === "empty") return [T.BLANK, null];
    if (ka === kb) return va === vb ? null : [T.TEXT, null];
    return [T.KIND, null];
  }
  const sheetKey = name => { const m = /^\s*([IVX]+-\d+)\s*\./.exec(name); return m ? m[1] : normText(name); };
  function mergeOwner(sh) {
    const o = new Map();
    for (const [r1, c1, r2, c2] of sh.merges) for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) o.set(r + "," + c, r1 + "," + c1);
    return o;
  }
  function labelAt(sh, owner, r, c) {
    const k = r + "," + c, [kind, v] = classify(sh.cells.get(owner.get(k) || k));
    return kind === "text" ? v : null;
  }
  function labelsFor(sh, owner, r, c) {
    const rp = [], cp = [];
    for (let cc = 1; cc < c; cc++) { const t = labelAt(sh, owner, r, cc); if (t && rp[rp.length - 1] !== t) rp.push(t); }
    for (let rr = 1; rr < r; rr++) { const t = labelAt(sh, owner, rr, c); if (t && cp[cp.length - 1] !== t) cp.push(t); }
    return [rp.join(" > "), cp.join(" > ")];
  }
  function pack(sh) {
    if (!sh) return null;
    const cells = {}, kinds = {}, widths = {};
    for (const [k, v] of sh.cells) { cells[k] = display(v); if (v[0] !== "n") kinds[k] = v[0]; }
    for (const k in sh.widths) if (+k <= sh.maxC) widths[k] = sh.widths[k];
    return { maxR: sh.maxR, maxC: sh.maxC, cells, kinds, merges: sh.merges.map(m => m.slice()), widths };
  }
  const colName = n => { let s = ""; while (n) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
  const fmtDelta = d => { const s = decFmt(d); return s.startsWith("-") ? s : "+" + s; };

  function compareBooks(L, R) {
    const left = new Map(), right = new Map();
    for (const s of L) if (!left.has(sheetKey(s.name))) left.set(sheetKey(s.name), s);
    for (const s of R) if (!right.has(sheetKey(s.name))) right.set(sheetKey(s.name), s);
    const order = L.map(s => sheetKey(s.name)).concat(R.map(s => sheetKey(s.name)).filter(k => !left.has(k)));
    return order.map(key => {
      const a = left.get(key), b = right.get(key);
      const entry = { key, name: (a || b).name, left: pack(a), right: pack(b), diffs: [] };
      if (!a || !b) {
        entry.diffs.push({ r: 1, c: 1, addr: "-", type: T.SHEET, lv: a ? "(있음)" : "", rv: b ? "(있음)" : "", delta: "",
          rowLabel: "", colLabel: a ? "통계 결과 파일에 시트 없음" : "학교 제출 파일에 시트 없음" });
        return entry;
      }
      const oa = mergeOwner(a), ob = mergeOwner(b);
      const maxR = Math.max(a.maxR, b.maxR), maxC = Math.max(a.maxC, b.maxC);
      for (let r = 1; r <= maxR; r++) for (let c = 1; c <= maxC; c++) {
        const ca = a.cells.get(r + "," + c), cb = b.cells.get(r + "," + c);
        if (!ca && !cb) continue;
        const res = compareCells(ca, cb); if (!res) continue;
        let [rowLabel, colLabel] = labelsFor(a, oa, r, c);
        if (!rowLabel && !colLabel) [rowLabel, colLabel] = labelsFor(b, ob, r, c);
        entry.diffs.push({ r, c, addr: colName(c) + r, type: res[0], lv: display(ca), rv: display(cb),
          delta: res[1] ? fmtDelta(res[1]) : "", rowLabel, colLabel });
      }
      return entry;
    });
  }

  // ---- 학교 짝짓기 (파일명 속 학교명)
  const NOISE = ["제출자료 조회", "제출자료조회", "특수교육통계", "제출자료", "비교결과"];
  const LEVELS = [["초등학교", "초"], ["중학교", "중"], ["고등학교", "고"], ["특수학교", "특"]];
  function schoolName(fn) {
    let stem = fn.replace(/\.[^.]*$/, "").normalize("NFC");
    for (const w of NOISE) stem = stem.split(w).join(" ");
    stem = stem.replace(/\(.*?\)|\[.*?\]/g, " ").replace(/\d{4,}/g, " ");
    const parts = stem.split(/[_\-\s]+/).filter(Boolean);
    for (const p of parts) if (/(초등학교|중학교|고등학교|학교|초|중|고)$/.test(p)) return p;
    return parts.join("");
  }
  function schoolKeys(name) {
    let k = name.replace(/\s+/g, "");
    for (const [l, s] of LEVELS) if (k.endsWith(l)) k = k.slice(0, -l.length) + s;
    return [k, k.replace(/^(서울특별시|서울시|서울)/, "")];
  }
  function pairFiles(school, stats) {
    const used = new Set(), info = new Map(stats.map(f => [f, schoolKeys(schoolName(f.name))]));
    const pairs = school.map(sf => {
      const name = schoolName(sf.name), [k1, k2] = schoolKeys(name);
      const free = stats.filter(f => !used.has(f));
      let match = null;
      for (const pick of [q => info.get(q)[0] === k1, q => info.get(q)[1] === k2,
                          q => info.get(q)[1].endsWith(k2) || k2.endsWith(info.get(q)[1])]) {
        const c = free.filter(pick);
        if (c.length === 1) { match = c[0]; break; }
        if (c.length > 1) break;
      }
      if (match) used.add(match);
      return [name, sf, match];
    });
    return [pairs, stats.filter(f => !used.has(f))];
  }

  async function run(schoolFiles, statsFiles, onProgress) {
    const byName = (a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0;  // compare.py 의 sorted() 와 같은 순서
    const [pairs, leftover] = pairFiles([...schoolFiles].sort(byName), [...statsFiles].sort(byName));
    const schools = [];
    for (let i = 0; i < pairs.length; i++) {
      const [name, sf, tf] = pairs[i];
      onProgress && onProgress(i + 1, pairs.length, name);
      const item = { name, schoolFile: sf.name, statsFile: tf ? tf.name : "", sheets: [], error: "" };
      try {
        if (!tf) item.error = "짝이 되는 통계 결과 파일을 찾지 못했습니다.";
        else item.sheets = compareBooks(await readXlsx(await sf.arrayBuffer()), await readXlsx(await tf.arrayBuffer()));
      } catch (e) { item.error = "파일을 읽지 못했습니다: " + e.message; }
      item.diffCount = item.sheets.reduce((a, s) => a + s.diffs.length, 0);
      schools.push(item);
    }
    for (const tf of leftover)
      schools.push({ name: schoolName(tf.name), schoolFile: "", statsFile: tf.name, sheets: [], diffCount: 0,
        error: "짝이 되는 학교 제출 파일을 찾지 못했습니다." });
    const now = new Date(), p2 = x => String(x).padStart(2, "0");
    return { title: "특수교육통계 제출자료 비교", version: "1.1.0",
      generated: `${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`,
      schools };
  }
  return { run, readXlsx, compareBooks, schoolName, dec, decFmt };
})();

function addFiles(k, files) {
  const skipped = [];
  for (const f of files) {
    if (!/\.(xlsx|xlsm)$/i.test(f.name) || f.name.startsWith("~$")) { skipped.push(f.name); continue; }
    picked[k] = picked[k].filter(x => x.name !== f.name).concat(f);
  }

}

}
async function startCompare() {
  const go = $("#go"); go.disabled = true;
  if (typeof DecompressionStream === "undefined") {

  }
}
$("#file").onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ""; };

function downloadCsv() {
  const q = v => { const s = String(v ?? ""); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [["학교", "시트", "셀", "행 제목", "열 제목", "학교 제출 값", "통계 결과 값", "차이(통계-학교)", "유형"]];
  for (const s of state.data.schools) {
    if (s.error) lines.push([s.name, "", "", "", "", s.schoolFile, s.statsFile, "", s.error]);
    for (const sh of s.sheets || []) for (const d of sh.diffs)
      lines.push([s.name, sh.name, d.addr, d.rowLabel, d.colLabel, d.lv, d.rv, d.delta, d.type]);
  }
  const blob = new Blob(["﻿" + lines.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  // 일부 브라우저는 한글 파일명을 "download"로 바꿔 저장하므로 영문으로 둔다
  a.download = `check-list_${state.data.generated.replace(/[-: ]/g, "").slice(0, 12)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// 'I-2.  특수학급(순회학급 포함)  학년 및 장애유형별' -> 'I-2 학년 및 장애유형별'
function tabLabel(sh) {
  const parts = sh.name.split(/\s{2,}/);
  return parts.length > 1 ? sh.key + " " + parts[parts.length - 1] : sh.name;
}

// ---------------------------------------------------------------- 2분할 시트
function sheetTable(side, pack, diffSet) {
  if (!pack) return `<div class="missing">이 파일에는 해당 시트가 없습니다.</div>`;
  const sh = state.data.schools[state.school].sheets[state.sheet];
  const maxR = Math.max(sh.left ? sh.left.maxR : 0, sh.right ? sh.right.maxR : 0, 1);
  const maxC = Math.max(sh.left ? sh.left.maxC : 0, sh.right ? sh.right.maxC : 0, 1);
  const span = {}, hidden = new Set();
  for (const [r1, c1, r2, c2] of pack.merges) {
    span[r1 + "," + c1] = [r2 - r1 + 1, c2 - c1 + 1];
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (r !== r1 || c !== c1) hidden.add(r + "," + c);
  }
  let h = `<table class="sheet"><colgroup><col style="width:38px">`;
  for (let c = 1; c <= maxC; c++) {
    const w = pack.widths[c] ? Math.max(56, Math.round(pack.widths[c] * 8)) : 72;
    h += `<col style="width:${w}px">`;
  }
  h += `</colgroup><thead><tr><th class="corner"></th>`;
  for (let c = 1; c <= maxC; c++) h += `<th>${colName(c)}</th>`;
  h += `</tr></thead><tbody>`;
  for (let r = 1; r <= maxR; r++) {
    h += `<tr><th>${r}</th>`;
    for (let c = 1; c <= maxC; c++) {
      const k = r + "," + c;
      if (hidden.has(k)) continue;
      const v = pack.cells[k] ?? "";
      const sp = span[k];
      const kind = pack.kinds[k] || (v === "" ? "" : "n");
      const cls = [kind === "n" ? "num" : "txt"];
      if (diffSet.has(k)) cls.push("diff");
      h += `<td id="${side}-${r}-${c}" data-k="${k}" class="${cls.join(" ")}"${sp ? ` rowspan="${sp[0]}" colspan="${sp[1]}"` : ""}>${esc(v)}</td>`;
    }
    h += `</tr>`;
  }
  return h + `</tbody></table>`;
}

function renderSplit() {
  const s = state.data.schools[state.school];
  const sh = (s.sheets || [])[state.sheet];
  if (!sh) { $("#split").innerHTML = `<div class="pane" style="grid-column:1/-1"><div class="missing">${esc(s.error || "비교할 시트가 없습니다.")}</div></div>`; return; }
  const diffSet = new Set(sh.diffs.map(d => d.r + "," + d.c));
  $("#split").innerHTML = `
    <div class="pane"><h3>학교 제출 <small>${esc(s.schoolFile)}</small></h3><div class="scroll" id="sL">${sheetTable("L", sh.left, diffSet)}</div></div>
    <div class="pane"><h3>특수교육통계 결과 <small>${esc(s.statsFile)}</small></h3><div class="scroll" id="sR">${sheetTable("R", sh.right, diffSet)}</div></div>`;
  syncScroll($("#sL"), $("#sR"));
  $("#split").onclick = e => {
    const td = e.target.closest("td.diff"); if (!td) return;
    const [r, c] = td.dataset.k.split(",").map(Number);
    const idx = sh.diffs.findIndex(d => d.r === r && d.c === c);
    if (idx >= 0) jump(state.school, state.sheet, idx);
  };
  if (state.active) markActive();
}

let syncing = false;
function syncScroll(a, b) {
  const link = (x, y) => x.addEventListener("scroll", () => {
    if (syncing) return; syncing = true;
    y.scrollTop = x.scrollTop; y.scrollLeft = x.scrollLeft;
    requestAnimationFrame(() => { syncing = false; });
  });
  link(a, b); link(b, a);
}

// ---------------------------------------------------------------- 확인필요사항 목록
function issueRows() {
  const rows = [];
  state.data.schools.forEach((s, si) => {
    if (state.scope !== "all" && si !== state.school) return;
    if (s.error && state.scope !== "sheet") rows.push({ si, sh: -1, i: -1, err: s.error, s });
    (s.sheets || []).forEach((sh, shi) => {
      if (state.scope === "sheet" && shi !== state.sheet) return;
      sh.diffs.forEach((d, i) => rows.push({ si, sh: shi, i, d, s, sheet: sh }));
    });
  });
  return rows;
}

function renderIssues() {
  document.querySelectorAll("#scope button").forEach(b => b.classList.toggle("on", b.dataset.v === state.scope));
  const rows = issueRows();
  state.rows = rows;
  $("#icount").textContent = `${rows.length}건`;
  if (!rows.length) {
    $("#ilist").innerHTML = `<div class="empty">${state.scope === "sheet" ? "이 시트는 두 파일의 값이 모두 같습니다." : "확인필요사항이 없습니다. 두 파일의 값이 모두 같습니다."}</div>`;
    return;
  }
  const showSchool = state.scope === "all";
  let h = `<table class="it"><thead><tr><th>#</th>${showSchool ? "<th>학교</th>" : ""}<th>시트</th><th>셀</th><th>항목(행)</th><th>구분(열)</th><th style="text-align:right">학교 제출</th><th style="text-align:right">통계 결과</th><th style="text-align:right">차이</th><th>유형</th></tr></thead><tbody>`;
  rows.forEach((x, n) => {
    if (x.err) {
      h += `<tr><td>${n + 1}</td>${showSchool ? `<td>${esc(x.s.name)}</td>` : ""}<td colspan="8"><span class="tag" style="color:var(--warn)">${esc(x.err)}</span></td></tr>`;
      return;
    }
    const a = state.active, on = a && a.si === x.si && a.sh === x.sh && a.i === x.i;
    const d = x.d;
    h += `<tr class="row ${on ? "on" : ""}" data-n="${n}"><td>${n + 1}</td>${showSchool ? `<td>${esc(x.s.name)}</td>` : ""}
      <td title="${esc(x.sheet.name)}">${esc(x.sheet.key)}</td><td>${esc(d.addr)}</td>
      <td>${esc(d.rowLabel)}</td><td>${esc(d.colLabel)}</td>
      <td class="v">${esc(d.lv) || "(빈칸)"}</td><td class="v">${esc(d.rv) || "(빈칸)"}</td>
      <td class="d">${esc(d.delta)}</td><td><span class="tag">${esc(d.type)}</span></td></tr>`;
  });
  $("#ilist").innerHTML = h + `</tbody></table>`;
  $("#ilist").onclick = e => {
    const tr = e.target.closest("tr.row"); if (!tr) return;
    const x = state.rows[+tr.dataset.n];
    jump(x.si, x.sh, x.i);
  };
  const on = $("#ilist tr.on"); if (on) on.scrollIntoView({ block: "nearest" });
}

function jump(si, shi, i) {
  const changed = si !== state.school || shi !== state.sheet;
  state.active = { si, sh: shi, i };
  if (si !== state.school) { state.school = si; renderSchools(); }
  state.sheet = shi;
  if (changed) renderSchool(); else { renderIssues(); markActive(); }
}

function markActive() {
  document.querySelectorAll("td.active").forEach(el => el.classList.remove("active"));
  const a = state.active; if (!a) return;
  const sh = state.data.schools[a.si].sheets[a.sh];
  const d = sh.diffs[a.i];
  syncing = true;
  for (const side of ["L", "R"]) {
    const box = $("#s" + side);
    const el = document.getElementById(`${side}-${d.r}-${d.c}`) || coveringCell(side, sh, d);
    if (!box || !el) continue;
    el.classList.remove("active"); void el.offsetWidth; el.classList.add("active");
    const bt = box.getBoundingClientRect(), et = el.getBoundingClientRect();
    box.scrollTop += (et.top - bt.top) - (box.clientHeight - el.offsetHeight) / 2;
    box.scrollLeft += (et.left - bt.left) - (box.clientWidth - el.offsetWidth) / 2;
  }
  requestAnimationFrame(() => { syncing = false; });
}
function coveringCell(side, sh, d) {
  const pack = side === "L" ? sh.left : sh.right; if (!pack) return null;
  for (const [r1, c1, r2, c2] of pack.merges)
    if (d.r >= r1 && d.r <= r2 && d.c >= c1 && d.c <= c2) return document.getElementById(`${side}-${r1}-${c1}`);
  return null;
}

document.addEventListener("keydown", e => {
  if (!state.data || !state.rows || e.target.tagName === "INPUT") return;
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const rows = state.rows.filter(x => !x.err); if (!rows.length) return;
  e.preventDefault();
  const a = state.active;
  let n = a ? rows.findIndex(x => x.si === a.si && x.sh === a.sh && x.i === a.i) : -1;
  n = e.key === "ArrowDown" ? Math.min(rows.length - 1, n + 1) : Math.max(0, n - 1);
  jump(rows[n].si, rows[n].sh, rows[n].i);
});

function setupResizer() {
  const main = $("#main"), bar = $("#resizer");
  bar.onmousedown = e => {
    e.preventDefault();
    const move = ev => {
      const r = main.getBoundingClientRect();
      const h = Math.min(r.height - 160, Math.max(80, r.bottom - ev.clientY));
      main.style.setProperty("--bottom", h + "px");
    };
    const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
    document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
  };
}

if (EMBEDDED) loadData(EMBEDDED); else renderDrop();
</script>
</body>
